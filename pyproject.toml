[build-system]
requires = ["uv_build>=0.12.24,<0.14.0"]
build-backend = "uv_build"

[project]
name = "pymarklet"
version = "0.1.0"
description = "Generate browser bookmarklets that run Python with Pyodide."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PyMarklet contributors" }]
keywords = ["bookmarklet", "browser", "pyodide", "python", "webassembly"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",

  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Block120/PyMarklet"
Repository = "https://github.com/Block120/PyMarklet"
Issues = "https://github.com/Block120/PyMarklet/issues"
Changelog = "https://github.com/Block120/PyMarklet/releases"

[project.scripts]
pymarklet = "pymarklet.cli:main"

[project.optional-dependencies]
test = []

[tool.uv]
default-groups = ["test"]

[dependency-groups]
test = []
