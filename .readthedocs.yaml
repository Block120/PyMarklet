version: 2

build:
  os: ubuntu-24.04
  tools:
    nodejs: "22"

  commands:
    # Changed from docs to website
    - cd website && npm install
    - cd website && npm run build
    - mkdir --parents $READTHEDOCS_OUTPUT/html/
    - cp --recursive website/build/* $READTHEDOCS_OUTPUT/html/
